spring.application.name=stock-simulator

# Load the repo-root .env (KEY=VALUE) when running locally. In other envs, use real env vars.
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL (defaults match compose.yaml)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stocksim}
spring.datasource.username=${DB_USER:stocksim}
spring.datasource.password=${DB_PASSWORD:stocksim}

# Flyway owns the schema. Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

# Actuator
management.endpoints.web.exposure.include=health,info

# Finnhub
finnhub.api-key=${FINNHUB_API_KEY:}
finnhub.rest-base-url=https://finnhub.io/api/v1
finnhub.websocket-url=wss://ws.finnhub.io
