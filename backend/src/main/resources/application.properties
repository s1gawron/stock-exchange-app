spring.application.name=stock-simulator

# Load the repo-root .env (KEY=VALUE) when running locally. In other envs, use real env vars.
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL (defaults match compose.yaml)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stocksim}
spring.datasource.username=${DB_USER:stocksim}
spring.datasource.password=${DB_PASSWORD:stocksim}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

# Actuator
management.endpoints.web.exposure.include=health,info

# Finnhub
finnhub.api-key=${FINNHUB_API_KEY:}
finnhub.rate-limit-per-minute=55

# Errors as RFC 9457 problem details
spring.mvc.problemdetails.enabled=true

# Market data: "finnhub" (default) or "fake" (offline, for tests and local dev without a key)
marketdata.provider=${MARKET_DATA_PROVIDER:finnhub}
marketdata.quote-cache-ttl=5s
marketdata.max-quote-age=15m
# Fake provider only: report the market as open, so trading can be tested any time
marketdata.fake.market-open=true
# Fallback calendar, used only when Finnhub market status is unavailable.
# Finnhub's holiday list is merged in at startup and daily; this seed list covers offline starts.
marketdata.us-calendar.holidays=\
  2026-01-01,2026-01-19,2026-02-16,2026-04-03,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-11-26,2026-12-25,\
  2027-01-01,2027-01-18,2027-02-15,2027-03-26,2027-05-31,2027-06-18,2027-07-05,2027-09-06,2027-11-25,2027-12-24
marketdata.us-calendar.early-closes=2026-11-27,2026-12-24,2027-11-26

# Trading
trading.starting-cash=100000
