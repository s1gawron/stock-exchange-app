# Development values, the same as in application-docker.yaml. Change them for a shared cluster.
# The Finnhub token is not stored here, create it with: kubectl create secret generic finnhub-token --from-literal=token=<your-token>
apiVersion: v1
kind: Secret
metadata:
  name: stock-exchange-app-secret
type: Opaque
stringData:
  database-username: postgres
  database-password: postgres
  jwt-secret-key: "11111111111111111111111111111111"
